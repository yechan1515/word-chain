<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>온라인 끝말잇기</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;
  background:#0f172a;color:#f8fafc;
  font-family:system-ui,sans-serif;
}
main{max-width:500px;margin:auto}
h1{text-align:center}
.card{
  background:#1e293b;padding:20px;
  border-radius:18px;margin:16px 0;
}
input,button{
  display:block;width:100%;padding:13px;
  margin-top:10px;border:0;border-radius:10px;
  font-size:16px;
}
input{background:#334155;color:white}
button{
  background:#3b82f6;color:white;
  font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.45}
.secondary{background:#475569}
.center{text-align:center}
#status{color:#93c5fd;text-align:center}
#roomCode{font-size:28px;font-weight:bold;letter-spacing:4px}
#lastWord{font-size:32px;font-weight:bold}
#message{color:#fbbf24;min-height:24px}
#words{display:flex;flex-wrap:wrap;gap:8px;padding:0;list-style:none}
#words li{background:#334155;padding:8px;border-radius:8px}
.hidden{display:none!important}
.small{font-size:13px;color:#94a3b8}
</style>
</head>
<body>
<main>
<h1>🔤 끝말잇기</h1>
<p id="status">Firebase 연결 중...</p>

<section id="setup" class="card">
  <h3>닉네임</h3>
  <input id="nickname" maxlength="12" placeholder="닉네임 입력">
  <button id="createBtn" disabled>새 방 만들기</button>
  <hr style="border-color:#475569;margin:20px 0">
  <input id="roomInput" maxlength="6" placeholder="6자리 방 코드">
  <button id="joinBtn" class="secondary" disabled>방 참가하기</button>
</section>

<section id="game" class="card hidden">
  <p class="center">방 코드</p>
  <div id="roomCode" class="center"></div>
  <button id="copyBtn" class="secondary">방 코드 복사</button>

  <p id="players" class="center"></p>
  <h3 id="turn" class="center">대기 중</h3>

  <div class="card center" style="background:#0f172a">
    <p class="small">마지막 단어</p>
    <div id="lastWord">첫 단어를 입력하세요</div>
    <p id="required"></p>
  </div>

  <form id="wordForm">
    <input id="wordInput" maxlength="30" placeholder="단어 입력" autocomplete="off">
    <button id="submitBtn" type="submit">단어 제출</button>
  </form>

  <p id="message" role="status"></p>
  <h3>사용한 단어</h3>
  <ul id="words"></ul>
  <button id="leaveBtn" class="secondary">나가기</button>
</section>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDArGtDypSSmWo6BiHDtQBaK5JeIkN0v14",
  authDomain: "miniboardgame-25324.firebaseapp.com",
  databaseURL: "https://miniboardgame-25324-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "miniboardgame-25324",
  storageBucket: "miniboardgame-25324.firebasestorage.app",
  messagingSenderId: "937903418490",
  appId: "1:937903418490:web:723c9d64bdecb0fe0c5fc3"
};

const $ = id => document.getElementById(id);
let db, uid, roomRef, roomId, roomData, listener;
let busy = false;

function setStatus(text){ $("status").textContent = text; }
function say(text){ $("message").textContent = text; }

function normalize(s){ return s.trim().replace(/\s+/g,""); }
function first(s){ return [...s][0]; }
function last(s){ return [...s].at(-1); }

async function init(){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();

    await firebase.auth().signInAnonymously();
    uid = firebase.auth().currentUser.uid;

    $("createBtn").disabled = false;
    $("joinBtn").disabled = false;
    setStatus("Firebase 연결 완료!");
  }catch(e){
    setStatus("Firebase 연결 실패: " + e.message);
    console.error(e);
  }
}

function newCode(){
  return String(Math.floor(100000 + Math.random()*900000));
}

async function createRoom(){
  if(busy) return;
  const name = $("nickname").value.trim();
  if(!name) return alert("닉네임을 입력해!");

  busy = true;
  $("createBtn").disabled = true;

  try{
    let success = false;

    for(let i=0;i<10;i++){
      const code = newCode();
      const ref = db.ref("rooms/"+code);

      const result = await ref.transaction(old=>{
        if(old !== null) return;
        return {
          players:{[uid]:{name}},
          words:[],
          lastWord:"",
          turn:uid,
          started:false,
          createdAt:Date.now()
        };
      });

      if(result.committed){
        roomId = code;
        success = true;
        break;
      }
    }

    if(!success) throw Error("방 생성에 실패했어.");
    enterRoom();
  }catch(e){
    alert("방 생성 실패: "+e.message);
  }finally{
    busy = false;
    $("createBtn").disabled = false;
  }
}

async function joinRoom(){
  if(busy) return;

  const name = $("nickname").value.trim();
  const code = $("roomInput").value.trim();

  if(!name) return alert("닉네임을 입력해!");
  if(!/^\d{6}$/.test(code)) return alert("방 코드는 숫자 6자리야.");

  busy = true;
  $("joinBtn").disabled = true;

  try{
    const ref = db.ref("rooms/"+code);

    const result = await ref.transaction(old=>{
      if(!old || !old.players) return;
      if(old.players[uid]) return;
      if(old.started || Object.keys(old.players).length >= 2) return;

      old.players[uid] = {name};
      old.started = true;
      return old;
    });

    if(!result.committed){
      throw Error("방이 없거나 이미 가득 찼어.");
    }

    roomId = code;
    enterRoom();
  }catch(e){
    alert("참가 실패: "+e.message);
  }finally{
    busy = false;
    $("joinBtn").disabled = false;
  }
}

function enterRoom(){
  $("setup").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("roomCode").textContent = roomId;

  roomRef = db.ref("rooms/"+roomId);

  if(listener) roomRef.off("value",listener);

  listener = roomRef.on("value",snap=>{
    roomData = snap.val();

    if(!roomData){
      setStatus("방이 삭제되었어.");
      return;
    }
    render();
  },error=>{
    setStatus("방 읽기 실패: "+error.message);
  });
}

function render(){
  const r = roomData;
  const players = r.players || {};
  const ids = Object.keys(players);

  $("players").textContent = ids.map((id,i)=>
    `${i+1}. ${players[id].name}${id===uid?" (나)":""}`
  ).join(" | ");

  if(ids.length < 2){
    $("turn").textContent = "상대방 기다리는 중...";
    setStatus("방 코드를 친구에게 알려 줘!");
  }else if(r.turn===uid){
    $("turn").textContent = "🟢 내 차례!";
    setStatus("단어를 입력해!");
  }else{
    $("turn").textContent = "⏳ 상대방 차례";
    setStatus("상대방이 입력 중이야.");
  }

  $("lastWord").textContent = r.lastWord || "첫 단어!";
  $("required").textContent = r.lastWord
    ? last(r.lastWord)+"(으)로 시작하는 단어"
    : "아무 단어나 입력해!";

  $("words").replaceChildren();

  (r.words||[]).slice().reverse().forEach(item=>{
    const li = document.createElement("li");
    li.textContent = item.word+" · "+item.name;
    $("words").appendChild(li);
  });

  const canPlay = ids.length===2 && r.turn===uid;
  $("wordInput").disabled = !canPlay;
  $("submitBtn").disabled = !canPlay;
}

async function submitWord(e){
  e.preventDefault();
  if(!roomRef || !roomData || busy) return;

  const word = normalize($("wordInput").value);

  if(!/^[가-힣]+$/.test(word)){
    say("한글 단어만 입력해!");
    return;
  }

  busy = true;
  $("submitBtn").disabled = true;

  try{
    const result = await roomRef.transaction(r=>{
      if(!r || !r.players || !r.started || r.turn!==uid) return;

      const words = r.words || [];

      if(words.some(x=>x.word===word)) return;
      if(r.lastWord && first(word)!==last(r.lastWord)) return;

      const other = Object.keys(r.players).find(id=>id!==uid);
      if(!other) return;

      r.words = words.concat([{
        word,
        uid,
        name:r.players[uid].name,
        time:Date.now()
      }]);

      r.lastWord = word;
      r.turn = other;
      return r;
    });

    if(result.committed){
      $("wordInput").value = "";
      say("성공! 🎉");
    }else{
      say("틀렸어! 끝 글자, 중복, 차례를 확인해.");
    }
  }catch(e){
    say("제출 실패: "+e.message);
  }finally{
    busy = false;
    render();
  }
}

$("createBtn").onclick = createRoom;
$("joinBtn").onclick = joinRoom;
$("wordForm").onsubmit = submitWord;

$("copyBtn").onclick = async()=>{
  try{
    await navigator.clipboard.writeText(roomId);
    say("방 코드 복사 완료!");
  }catch{
    say("방 코드: "+roomId);
  }
};

$("leaveBtn").onclick = ()=>{
  if(roomRef && listener) roomRef.off("value",listener);

  roomRef = null;
  listener = null;
  roomId = null;
  roomData = null;

  $("game").classList.add("hidden");
  $("setup").classList.remove("hidden");
  $("roomInput").value = "";
  setStatus("방에서 나왔어.");
};

init();
</script>
</body>
</html>
